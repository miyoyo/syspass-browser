services:
  syspass:
    image: syspass/syspass:3.1.0
    ports:
      - "9080:80"
      - "9443:443"
    environment:
      - USE_SSL=no
    depends_on:
      - db
    volumes:
      - syspass-config:/var/www/html/sysPass/app/config
      - syspass-backup:/var/www/html/sysPass/app/backup

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=syspass
    volumes:
      - syspass-db:/var/lib/mysql

volumes:
  syspass-config: {}
  syspass-backup: {}
  syspass-db: {}
